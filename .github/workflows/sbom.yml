name: sbom

on:
  push:
    branches: [main]
    paths:
      - "**/.terraform.lock.hcl"
      - "**/versions.tf"
      - "**/providers.tf"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: Generate provider SBOM
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write          # cosign keyless
      attestations: write      # SBOM attestation
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

      - name: Attest the SBOM
        uses: actions/attest-sbom@bd218ad7dbfcef3e30b3f64a280da9c75d536f4d # v2.1.0
        with:
          subject-path: sbom.cdx.json
          sbom-path: sbom.cdx.json
