name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        required: true
        type: choice
        options: [dev, staging, prod]

permissions:
  contents: read

concurrency:
  # Never run two applies for the same environment simultaneously, and don't
  # cancel an in-flight apply (state could be left locked / partially applied).
  group: terraform-apply-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"

jobs:
  apply:
    name: apply (${{ matrix.environment }})
    runs-on: ubuntu-24.04
    strategy:
      max-parallel: 1
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.environment)) || fromJSON('["dev","staging","prod"]') }}
    # GitHub Environment gates: protection rules (required reviewers / wait timer)
    # are configured on staging and prod. The job pauses until approved.
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: terraform init
        working-directory: environments/${{ matrix.environment }}
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
        run: terraform init -input=false

      - name: terraform plan
        working-directory: environments/${{ matrix.environment }}
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_platform_admins_group_id: ${{ vars.PLATFORM_ADMINS_GROUP_ID }}
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
        run: terraform plan -input=false -lock-timeout=120s -out=plan.tfplan

      - name: terraform apply
        working-directory: environments/${{ matrix.environment }}
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
        run: terraform apply -input=false -auto-approve -lock-timeout=120s plan.tfplan

      - name: Job summary
        if: always()
        run: |
          {
            echo "## terraform apply — ${{ matrix.environment }}"
            echo "- ref: \`${{ github.sha }}\`"
            echo "- result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
