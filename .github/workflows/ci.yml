name: ci

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # pre-commit gate: runs the hooks declared in .pre-commit-config.yaml
  # (terraform_fmt, terraform_validate, tflint, terraform_docs, checkov, trivy, tfsec,
  # gitleaks, ...). It previously called a reusable workflow in aircloud/.github that
  # does not exist (placeholder SHA), so GitHub rejected the whole workflow file.
  # The pre-commit-terraform image bundles every tool the hooks need; pinned by digest.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # gitleaks hook scans history

      - name: Run pre-commit (all files)
        env:
          IMAGE: ghcr.io/antonbabenko/pre-commit-terraform:v1.96.2@sha256:01f870b7689b5a09c1a370914fcddcac42c4b6478c9d369e1d2590dd0a66ffd0
        run: |
          docker run --rm \
            -e "USERID=$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/lint" -w /lint \
            "${IMAGE}" run --all-files --show-diff-on-failure

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # raven-actions/actionlint@v2.0.0 crashes on current runners
      # (ERR_PACKAGE_PATH_NOT_EXPORTED in @actions/tool-cache); run the upstream
      # image instead, pinned by digest.
      - name: Run actionlint
        env:
          IMAGE: rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo "${IMAGE}" -color

  docs-check:
    name: terraform-docs up to date
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: terraform-docs check (no diff)
        uses: terraform-docs/gh-actions@aeae0038ed47a547e0c0fca5c059d3335f48fb25 # v1.3.0
        with:
          working-dir: modules/network,modules/aks,modules/identity,modules/keyvault,modules/acr,modules/observability
          config-file: .terraform-docs.yml
          output-method: inject
          git-push: "false"
          fail-on-diff: "true"
