name: ci

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # pre-commit gate: runs the hooks declared in .pre-commit-config.yaml
  # (terraform_fmt, terraform_validate, tflint, terraform_docs, checkov, trivy, tfsec,
  # gitleaks, ...). It previously called a reusable workflow in aircloud/.github that
  # does not exist (placeholder SHA), so GitHub rejected the whole workflow file.
  # The pre-commit-terraform image bundles every tool the hooks need; pinned by digest.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # gitleaks hook scans history

      - name: Run pre-commit (all files)
        env:
          # tflint --init downloads the azurerm ruleset from the GitHub API; an
          # authenticated (read-only) token avoids the shared-runner rate limit.
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/antonbabenko/pre-commit-terraform:v1.96.2@sha256:01f870b7689b5a09c1a370914fcddcac42c4b6478c9d369e1d2590dd0a66ffd0
        run: |
          docker run --rm \
            -e "USERID=$(id -u):$(id -g)" -e GITHUB_TOKEN \
            -v "${GITHUB_WORKSPACE}:/lint" -w /lint \
            "${IMAGE}" run --all-files --show-diff-on-failure

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # raven-actions/actionlint@v2.0.0 crashes on current runners
      # (ERR_PACKAGE_PATH_NOT_EXPORTED in @actions/tool-cache); run the upstream
      # image instead, pinned by digest.
      - name: Run actionlint
        env:
          IMAGE: rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo "${IMAGE}" -color

  docs-check:
    name: terraform-docs up to date
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The gh-actions wrapper resolved .terraform-docs.yml relative to each module
      # directory (not found, so it rendered with defaults and always diffed).
      # Run terraform-docs 0.19.0 directly with the repo-root config instead.
      - name: terraform-docs check (no diff)
        env:
          IMAGE: quay.io/terraform-docs/terraform-docs:0.19.0@sha256:d91005e55ad9e2f5a1c9cd7c78520414615ec150c922575887e94f5f5fe26c66
        run: |
          set -euo pipefail
          for m in network aks identity keyvault acr observability; do
            docker run --rm -u "$(id -u):$(id -g)" \
              -v "${GITHUB_WORKSPACE}:/w" -w "/w/modules/${m}" \
              "${IMAGE}" --config /w/.terraform-docs.yml .
          done
          if ! git diff --exit-code -- modules; then
            echo "::error::terraform-docs tables are stale; run 'task docs' and commit."
            exit 1
          fi
