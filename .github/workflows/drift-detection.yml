name: drift-detection

on:
  schedule:
    # Every weekday at 06:00 UTC.
    - cron: "0 6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: drift-detection-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"

jobs:
  drift:
    name: drift (${{ matrix.environment }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    permissions:
      contents: read
      id-token: write
      issues: write   # open/update a drift issue
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: terraform init
        working-directory: environments/${{ matrix.environment }}
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
        run: terraform init -input=false

      - name: terraform plan -detailed-exitcode
        id: plan
        working-directory: environments/${{ matrix.environment }}
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_platform_admins_group_id: ${{ vars.PLATFORM_ADMINS_GROUP_ID }}
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=120s -detailed-exitcode -out=drift.tfplan
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 0 = no changes, 1 = error, 2 = drift detected
          if [ "$code" -eq 1 ]; then exit 1; fi

      - name: Open / update drift issue
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const env = '${{ matrix.environment }}';
            const title = `Infrastructure drift detected: ${env}`;
            const body = [
              `Scheduled \`terraform plan\` for **${env}** reported drift (exit code 2).`,
              ``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Reconcile by re-running \`terraform-apply\` for ${env} or by reverting the manual change.`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'drift',
            });
            const found = existing.data.find(i => i.title === title);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: found.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['drift'],
              });
            }
