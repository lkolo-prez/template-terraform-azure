name: Bug report
description: Report a defect in the Terraform modules, environments or CI.
title: "bug: <short summary>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Do **not** include secrets, subscription IDs,
        tenant IDs or full plan output that may contain sensitive values.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and the impact.
      placeholder: terraform apply fails on the aks module with ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1. cd environments/dev
        2. terraform plan ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Affected environment
      options: [dev, staging, prod, module-only, n/a]
    validations:
      required: true
  - type: input
    id: terraform-version
    attributes:
      label: Terraform version
      placeholder: "1.9.8"
    validations:
      required: true
  - type: input
    id: provider-version
    attributes:
      label: azurerm provider version
      placeholder: "4.21.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redacted)
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed all secrets and sensitive identifiers.
          required: true
